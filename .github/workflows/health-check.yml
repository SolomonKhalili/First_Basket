# Checks that everything is updating by itself (website, live job, nightly update, Cloudflare relay, the Mac) and
# opens an issue "⚠️ First Basket needs attention" when something isn't — GitHub emails it and shows it in the
# GitHub app. Closes the issue by itself once things work again. See health_check.py.
#   • ~7:30 AM, ~12:30 PM, ~5:30 PM and ~9:30 PM New York time (an hour earlier in summer time)
#   • on demand: Actions → health-check → Run workflow
name: health-check

on:
  schedule:
    - cron: "30 12,17,22 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: health-check
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: health_check.py
          sparse-checkout-cone-mode: false
      - name: Check everything and raise / clear the alert
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_HEALTH: ${{ vars.MAC_HEALTH }}
        run: python3 health_check.py --report
