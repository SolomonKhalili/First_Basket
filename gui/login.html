<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Basket Picks · Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; color: #eef0f4;
    font: 15px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(700px 380px at 15% 0%, rgba(255,122,26,.30), transparent 60%),
                radial-gradient(600px 340px at 100% 0%, rgba(59,130,246,.22), transparent 60%), #0a0c11; }
  .box { width: min(400px, 100%); background: linear-gradient(160deg, #171c29, #0d1017 70%); border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px; padding: 28px 26px 24px; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  .ball { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-size: 32px; margin-bottom: 14px;
    background: radial-gradient(circle at 35% 30%, #ffb26b, #ea580c 70%); box-shadow: 0 6px 22px rgba(234,88,12,.45); }
  h1 { margin: 0; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 800; font-size: 34px;
    text-transform: uppercase; line-height: 1; }
  h1 span { color: #ff8a2b; }
  p.sub { color: rgba(255,255,255,.6); margin: 6px 0 20px; }
  label { display: block; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.75); margin: 12px 0 6px; }
  input { width: 100%; font: inherit; color: #fff; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
    border-radius: 12px; padding: 12px 14px; }
  input:focus { outline: 2px solid rgba(255,138,43,.6); border-color: #ff8a2b; }
  button { width: 100%; margin-top: 20px; font: inherit; font-weight: 700; color: #fff; border: 0; border-radius: 12px; padding: 13px;
    cursor: pointer; background: linear-gradient(135deg, #ff8a2b, #ea580c); box-shadow: 0 6px 20px rgba(234,88,12,.4); }
  .err { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: rgba(248,113,113,.14); color: #fca5a5; font-size: 14px; }
  .err:empty { display: none; }
  .foot { margin-top: 16px; color: rgba(255,255,255,.45); font-size: 12.5px; text-align: center; }
</style>
</head>
<body>
  <form class="box" method="post" action="/login" autocomplete="on">
    <div class="ball">🏀</div>
    <h1>First Basket <span>Picks</span></h1>
    <p class="sub">Private — log in to see tonight's picks.</p>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required value="{{USER}}">
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
    <div class="err" role="alert">{{ERROR}}</div>
    <div class="foot">Ask the owner for an account.</div>
  </form>
</body>
</html>
